name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Зависимости
        run: pip install -r requirements-dev.txt
      - name: Линтер и форматирование
        run: ruff check . && ruff format --check .
      - name: Тесты
        run: |
          set -o pipefail
          pytest -q -rf 2>&1 | tee pytest-output.txt
      - name: Упавшие тесты — в аннотации (видны на странице запуска)
        if: failure()
        run: grep -E "^(FAILED|ERROR)|^E " pytest-output.txt | head -10 | sed 's/^/::error::/'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа
        run: docker build -t somon-job-bot .
      - name: Образ запускается
        run: docker run --rm somon-job-bot python -m jobbot --help
      - name: Контейнер работает не от root
        run: test "$(docker run --rm somon-job-bot id -u)" != "0"
